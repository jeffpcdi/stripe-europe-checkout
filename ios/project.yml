name: ROINADOSCompanion

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic
    APS_ENVIRONMENT: development
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  ROINADOSCompanion:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: ROINADOSCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roinados.companion
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: ROINADOSCompanion/Info.plist
      properties:
        CFBundleDisplayName: ROI-NADOS
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        ROINADOS_KEYCHAIN_GROUP: "$(AppIdentifierPrefix)com.roinados.shared"
        CFBundleURLTypes:
          - CFBundleURLName: com.roinados.companion
            CFBundleURLSchemes:
              - roinados
    entitlements:
      path: ROINADOSCompanion/ROINADOSCompanion.entitlements
    dependencies:
      - target: ROINADOSWidget

  ROINADOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ROINADOSWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roinados.companion.widget
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: ROINADOSWidget/Info.plist
      properties:
        CFBundleDisplayName: ROI-NADOS
        ROINADOS_KEYCHAIN_GROUP: "$(AppIdentifierPrefix)com.roinados.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ROINADOSWidget/ROINADOSWidget.entitlements
