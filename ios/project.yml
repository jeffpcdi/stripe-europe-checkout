name: ROINADOSCompanion

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic

targets:
  ROINADOSCompanion:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: ROINADOSCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roinados.companion
        INFOPLIST_KEY_CFBundleDisplayName: ROI-NADOS
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_ROINADOS_KEYCHAIN_GROUP: "$(AppIdentifierPrefix)com.roinados.shared"
    entitlements:
      path: ROINADOSCompanion/ROINADOSCompanion.entitlements
    dependencies:
      - target: ROINADOSWidget

  ROINADOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ROINADOSWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roinados.companion.widget
        INFOPLIST_KEY_CFBundleDisplayName: ROI-NADOS
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_ROINADOS_KEYCHAIN_GROUP: "$(AppIdentifierPrefix)com.roinados.shared"
    entitlements:
      path: ROINADOSWidget/ROINADOSWidget.entitlements
