name: Apply V16.15 Pixel Release

on:
  push:
    branches:
      - release/v16.15-pixel-config
    paths:
      - .github/workflows/apply-v16-15-pixel-release.yml

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v16.15-pixel-config
          fetch-depth: 0

      - name: Rebuild and verify tested patch
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .release/v16.15-pixel-config.part00
            .release/v16.15-pixel-config.part01
            .release/v16.15-pixel-config.part02
            .release/v16.15-pixel-config.part03
          )
          expected=(14000 14000 14000 9064)
          : > /tmp/v16.15-pixel-config.patch.gz
          for i in 0 1 2 3; do
            clean="/tmp/part-${i}.b64"
            bin="/tmp/part-${i}.bin"
            tr -d '\r\n\t ' < "${parts[$i]}" > "$clean"
            actual="$(wc -c < "$clean" | tr -d ' ')"
            test "$actual" = "${expected[$i]}" || {
              echo "part $i size mismatch: expected ${expected[$i]}, got $actual" >&2
              exit 1
            }
            if grep -q '[^A-Za-z0-9+/=]' "$clean"; then
              echo "part $i contains non-base64 characters" >&2
              exit 1
            fi
            base64 -d "$clean" > "$bin"
            cat "$bin" >> /tmp/v16.15-pixel-config.patch.gz
          done
          gunzip -c /tmp/v16.15-pixel-config.patch.gz > /tmp/v16.15-pixel-config.patch
          echo "8c0e35474615f6efd55ca871118e42e5b9f7d13ccbb1f423238b8635b029f883  /tmp/v16.15-pixel-config.patch" | sha256sum -c -
          git apply --check /tmp/v16.15-pixel-config.patch

      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v16.15-pixel-config.patch
          git diff --check
          git status --short

      - name: Commit tested source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v16.15): harden pixel configuration concurrency"
          git push origin HEAD:release/v16.15-pixel-config
