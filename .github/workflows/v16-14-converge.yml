name: V16.14 convergence

on:
  push:
    branches:
      - release/v16.14-convergence
    paths:
      - '.release/v16.14.patch.gz.b64'
      - '.github/workflows/v16-14-converge.yml'

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v16.14-convergence
          fetch-depth: 0
      - name: Apply canonical V16.14 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/v16.14.patch.gz.b64 | gzip -d > /tmp/v16.14.patch
          git apply --check /tmp/v16.14.patch
          git apply /tmp/v16.14.patch
          rm -rf .release
          rm -f .github/workflows/v16-14-converge.yml
          git config user.name 'roi-nados-release'
          git config user.email 'release@roi-nados.local'
          git add -A
          git commit -m 'release(v16.14): converge v16.13 baseline and railway healthcheck'
          git push origin HEAD:release/v16.14-convergence
