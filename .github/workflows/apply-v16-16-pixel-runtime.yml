name: Apply V16.16 Pixel Runtime

on:
  push:
    branches:
      - release/v16.16-pixel-runtime
    paths:
      - .github/workflows/apply-v16-16-pixel-runtime.yml
      - .release/v16.16-pixel-runtime.patch.gz.b64

permissions:
  contents: write

jobs:
  apply-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V16.15 release branch
        uses: actions/checkout@v4
        with:
          ref: release/v16.16-pixel-runtime
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild and verify P2 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/v16.16-pixel-runtime.patch.gz.b64 > /tmp/v16.16-pixel-runtime.patch.gz
          echo "b1469a33807463b0dc92836f2230a0874cfb26cb4dca4ca1c3a7d4911b9abebc  /tmp/v16.16-pixel-runtime.patch.gz" | sha256sum -c -
          gunzip -c /tmp/v16.16-pixel-runtime.patch.gz > /tmp/v16.16-pixel-runtime.patch
          echo "4bba1abb803d62e33acbb34e65216fb8b27093c98fb57ac85917e88c7c710e3d  /tmp/v16.16-pixel-runtime.patch" | sha256sum -c -
          git apply --check /tmp/v16.16-pixel-runtime.patch
          git apply /tmp/v16.16-pixel-runtime.patch
          git diff --check

      - name: Register V16.16 test and changelog
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          let pkg = fs.readFileSync(pkgPath, 'utf8');
          const p1 = 'node test/pixel-config-contract-v16-15.test.js';
          const p2 = 'node test/pixel-runtime-coverage-v16-16.test.js';
          if (!pkg.includes(p1)) throw new Error('official V16.15 P1 test is missing');
          if (!pkg.includes(p2)) pkg = pkg.replace(p1, p1 + ' && ' + p2);
          fs.writeFileSync(pkgPath, pkg);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const title = '# V16.16 — Pixels: verdade durável de execução';
          if (!changelog.startsWith(title)) {
            const note = `${title}\n\n- Pixel Health e Verify URL deixam de depender do hot cache podado de leads para comprovar execução do browser: a fonte primária passa a ser uma leitura agregada e tenant-safe do Neon em janela operacional de 365 dias.\n- A leitura usa account_id obrigatório, recência por updated_at, agrega sites modernos e o formato legado sem duplicação, preserva subdomínios e soma hits reais sem carregar leads completos em Node.\n- Falha do Neon degrada explicitamente para hot-cache-fallback com runtimeCoverageComplete=false; ausência de cache nesse cenário vira estado inconclusivo, nunca falso “não instalado”.\n- Verify URL preserva o hardening SSRF existente e aceita execução durável como evidência para GTM, SPA e consent managers mesmo quando o snippet não aparece no HTML.\n- Nenhum índice JSONB/GIN foi criado nesta versão; mudanças de índice ficam condicionadas a evidência de plano/EXPLAIN em produção.\n\n`;
            fs.writeFileSync(changelogPath, note + changelog);
          }
          NODE
          git diff --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund
          npm --prefix dashboard install --package-lock=false --no-audit --no-fund

      - name: Syntax, P1, P2 and scoped regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check pixel-runtime-coverage.js
          node --check db.js
          node --check server.js
          node test/pixel-config-contract-v16-15.test.js
          node test/pixel-runtime-coverage-v16-16.test.js
          tests=(
            tracker-runtime
            pixel-client-runtime
            pixel-delete
            pixel-durability
            pixel-gateway-binding
            pixel-isolation
            pixel-transport
            capi-token-sanitize
            capi-test-event-code
            capi-receipt
            gateway-only
            conversions-persistence
            conversion-database-retry
            conversion-operational
            conversion-pii
            persistence-flows
            overview-health
          )
          for test_name in "${tests[@]}"; do
            echo "==> $test_name"
            node "test/${test_name}.test.js"
          done

      - name: Production dashboard build
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production npm --prefix dashboard run build

      - name: Commit exact tested source tree
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- data pixels 2>/dev/null || true
          git clean -fd -- data pixels 2>/dev/null || true
          git rm -f .release/v16.16-pixel-runtime.patch.gz.b64 .github/workflows/apply-v16-16-pixel-runtime.yml
          git add CHANGELOG.md package.json pixel-runtime-coverage.js db.js server.js \
            dashboard/lib/types.ts \
            dashboard/components/conversions/install-check.tsx \
            dashboard/components/conversions/pixel-card.tsx \
            test/pixel-runtime-coverage-v16-16.test.js
          git diff --cached --check
          echo 'Staged V16.16 files:'
          git diff --cached --name-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(v16.16): durable pixel runtime coverage [skip ci]"
          git push origin HEAD:release/v16.16-pixel-runtime

      - name: Build exact V16.16 ZIP
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=stripe-europe-checkout-main/ HEAD > /tmp/roi-nados-v16.16.zip
          sha256sum /tmp/roi-nados-v16.16.zip

      - name: Upload exact V16.16 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: roi-nados-v16.16
          path: /tmp/roi-nados-v16.16.zip
          if-no-files-found: error
          retention-days: 30
