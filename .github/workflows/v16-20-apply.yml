name: Apply V16.20 verified overlay

on:
  push:
    branches:
      - release/v16.20-domain-closeout
    paths:
      - '.github/workflows/v16-20-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v16.20-domain-closeout
          fetch-depth: 0

      - name: Verify and apply overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/v16.20-safe-overlay.b64 > /tmp/v16-20-safe-overlay.tar.gz
          echo "7e67e00eb70f09d15577839e69f39ab7e8a05f0b1b69ce2f14570fd93874327e  /tmp/v16-20-safe-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v16-20-safe-overlay.tar.gz -C .
          rm -rf .release
          rm -f .github/workflows/v16-20-apply.yml

      - name: Commit final release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(v16.20): complete cloudflare saas custom domain infrastructure"
          git push origin HEAD:release/v16.20-domain-closeout
